<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #080808; color: #FFFFFF;">
  <div style="max-width: 600px; margin: 0 auto; background-color: #111111; padding: 40px; border-radius: 8px; border: 1px solid #1E1E1E; margin-top: 40px; margin-bottom: 40px;">
    
    <div style="text-align: center; margin-bottom: 30px;">
      <h2 style="margin: 0; color: #0ECB81; font-size: 28px; font-weight: 800; letter-spacing: -1px;">SwiftTrade</h2>
    </div>

    <h1 style="font-size: 22px; color: #FFFFFF; margin-top: 0; margin-bottom: 16px;">KYC Approved</h1>
    
    <p style="font-size: 16px; line-height: 1.6; margin-top: 0; margin-bottom: 24px; color: #888888;">
      Hi <strong style="color: #FFFFFF;">{{ full_name }}</strong>,<br><br>
      Great news! Your KYC documents have been successfully verified and approved.
    </p>

    <div style="background-color: rgba(14, 203, 129, 0.1); border: 1px solid #0ECB81; border-radius: 8px; padding: 20px; margin-bottom: 32px;">
      <p style="margin: 0; font-size: 14px; color: #0ECB81; line-height: 1.6;">
        You can now proceed to make withdrawals from your SwiftTrade wallet without any restrictions.
      </p>
    </div>

  </div>
  
  <div style="text-align: center; padding-bottom: 40px;">
    <p style="font-size: 12px; color: #555555; margin: 0;">&copy; {{ year }} SwiftTrade. All rights reserved.</p>
  </div>
</body>
</html>
