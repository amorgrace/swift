<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #28a745; }
        .content { font-size: 16px; margin-bottom: 20px; }
        .footer { font-size: 14px; color: #777; margin-top: 30px; border-top: 1px solid #ddd; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">KYC Approved</div>
        <div class="content">
            Hello {{ full_name }},<br><br>
            Great news! Your KYC documents have been successfully verified and approved.
            <br><br>
            You can now proceed to make withdrawals from your SwiftTrade wallet without any restrictions.
        </div>
        <div class="footer">
            &copy; {{ year }} SwiftTrade. All rights reserved.
        </div>
    </div>
</body>
</html>
